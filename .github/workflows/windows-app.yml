name: Windows App

# Builds the ready-to-run Windows version of UxPlay: uxplay.exe with all the
# DLLs and GStreamer plugins it needs, plus the UxPlay.exe tray app.
# Download the installer or the portable folder from the run's "Artifacts"
# section. To publish them as a GitHub Release, either push a tag starting
# with "v", or run this workflow from the Actions tab ("Run workflow") on
# master with a release tag such as v1.74-win2.

on:
  push:
    branches: [ master, main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this new tag (e.g. v1.74-win2; a tag with "beta" is a pre-release); leave empty to only build'
        required: false
        default: ''

# A newer push to the same branch or pull request makes the older build pointless.
# Releases (tags and "Run workflow") are never cancelled.
concurrency:
  group: windows-app-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

# Read-only unless a job needs more (only the release job may write, to publish).
# Actions are pinned to exact commits so a moved tag can't change what runs here.
permissions:
  contents: read

jobs:
  windows-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install MSYS2 and dependencies
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-ntldd

      - name: Build uxplay.exe
        # NO_MARCH_NATIVE: build for any x86-64 PC, not just this runner's CPU.
        # Hardening: stack protector, checked string/memory functions, and ASLR/DEP.
        env:
          CFLAGS: -fstack-protector-strong -D_FORTIFY_SOURCE=2
          CXXFLAGS: -fstack-protector-strong -D_FORTIFY_SOURCE=2
          LDFLAGS: -fstack-protector-strong -Wl,--dynamicbase -Wl,--nxcompat -Wl,--high-entropy-va
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNO_X11_DEPS=ON -DNO_MARCH_NATIVE=ON
          cmake --build build
          grep -q -- "-march=native" build/build.ninja && { echo "uxplay.exe must not be built with -march=native"; exit 1; } || true

      - name: Check uxplay.exe is hardened
        run: |
          flags=$(objdump -p build/uxplay.exe | sed -n '/DllCharacteristics/,/SizeOfStackReserve/p')
          echo "$flags"
          for f in DYNAMIC_BASE NX_COMPAT HIGH_ENTROPY_VA; do
            grep -q "$f" <<<"$flags" || { echo "uxplay.exe is missing $f"; exit 1; }
          done
          for f in -fstack-protector-strong -D_FORTIFY_SOURCE=2; do
            grep -q -- "$f" build/build.ninja || { echo "uxplay.exe was not compiled with $f"; exit 1; }
          done

      - name: Test how iPhones find the PC (mDNS, Mobile hotspot)
        # lib/mdnsd built into a test program with the same hardening, then run on this runner
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            -I lib windows/tests/mdnsd_test.c -o build/mdnsd_test.exe -lws2_32 -liphlpapi -lpthread
          build/mdnsd_test.exe

      - name: Bundle uxplay.exe with its DLLs and plugins
        run: windows/bundle.sh build windows/out/UxPlay

      - name: Test tray app
        shell: pwsh
        run: |
          dotnet test windows/tests/UxPlayTray.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw "tray app tests failed" }

      - name: Build tray app
        shell: pwsh
        env:
          # the release this build is for, if any (the tray app compares it with the newest release)
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          dotnet build windows/tray/UxPlayTray.csproj -c Release -o windows/out/tray "-p:ReleaseTag=$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "tray app build failed" }
          Copy-Item windows/out/tray/UxPlay.exe, windows/out/tray/UxPlay.exe.config windows/out/UxPlay/
          Copy-Item windows/README.txt windows/out/UxPlay/

      - name: Check the bundle works on its own
        shell: pwsh
        run: |
          $ux = (Resolve-Path windows/out/UxPlay/uxplay).Path
          $msys = '${{ steps.msys2.outputs.msys2-location }}'
          # Only the bundle and Windows itself: proves nothing is loaded from MSYS2.
          $env:PATH = "$ux\bin;C:\Windows\System32;C:\Windows"
          $env:GST_PLUGIN_SYSTEM_PATH_1_0 = "$ux\lib\gstreamer-1.0"
          $env:GST_PLUGIN_SCANNER_1_0 = "$ux\libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          $env:GST_REGISTRY_1_0 = "$env:RUNNER_TEMP\gst-registry.bin"
          $env:FONTCONFIG_PATH = "$ux\etc\fonts"
          $env:GIO_MODULE_DIR = "$ux\lib\gio\modules"
          Remove-Item Env:GST_PLUGIN_PATH, Env:GST_PLUGIN_PATH_1_0 -ErrorAction SilentlyContinue

          & "$ux\bin\uxplay.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "uxplay.exe -v failed ($LASTEXITCODE)" }

          # GStreamer elements uxplay's pipelines use on Windows
          $inspect = "$ux\bin\gst-inspect-1.0.exe"
          Copy-Item "$msys\ucrt64\bin\gst-inspect-1.0.exe" $inspect
          $missing = @()
          foreach ($e in 'appsrc','queue','h264parse','h265parse','decodebin','avdec_h264','avdec_h265',
                         'avdec_aac','avdec_alac','jpegdec','imagefreeze','textoverlay','videoflip',
                         'videoconvert','videoscale','autovideosink','d3d11videosink','autoaudiosink',
                         'wasapisink','directsoundsink','audioconvert','audioresample','volume','audiotestsrc',
                         'playbin3','souphttpsrc','hlsdemux2') {
            & $inspect --exists $e
            if ($LASTEXITCODE -ne 0) { $missing += $e }
          }
          Remove-Item $inspect
          if ($missing) { throw "Missing GStreamer elements: $($missing -join ', ')" }

          # The tray app's test sound pipeline (no sound card on the runner, so into fakesink)
          & "$ux\bin\gst-launch-1.0.exe" -q audiotestsrc num-buffers=10 freq=660 volume=0.3 ! audioconvert ! audioresample ! fakesink
          if ($LASTEXITCODE -ne 0) { throw "the test sound pipeline failed ($LASTEXITCODE)" }

          # HLS video (-hls) is fetched over HTTPS: libsoup and GLib's TLS must load from the bundle
          & "$ux\bin\gst-launch-1.0.exe" -q souphttpsrc location=https://github.com/ num-buffers=1 ! fakesink
          if ($LASTEXITCODE -ne 0) { throw "HTTPS download with the bundled GStreamer failed ($LASTEXITCODE)" }

          # Start the receiver for a few seconds and make sure it comes up cleanly.
          # Same video output and PIN options the tray app passes, so a rejected option fails here.
          # The recording goes to a folder with a space, as Videos\UxPlay\UxPlay <date> <time> does.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\rec dir" | Out-Null
          $uxArgs = '-n CI -nh -fps 60 -vsync no -hls -vs "d3d11videosink fullscreen-toggle-mode=alt-enter+property fullscreen=true" -pin -reg "' + "$env:RUNNER_TEMP\uxplay.register" + '"' +
                    ' -mp4 "' + "$env:RUNNER_TEMP\rec dir\UxPlay 2026-01-01 00-00-00" + '"'
          $p = Start-Process "$ux\bin\uxplay.exe" -ArgumentList $uxArgs -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $log = (Get-Content "$env:RUNNER_TEMP\out.txt", "$env:RUNNER_TEMP\err.txt" -Raw) -join "`n"
          Write-Output $log
          if (-not $alive) { throw "uxplay.exe exited early (code $($p.ExitCode))" }
          # uxplay's own messages must arrive while it runs (the tray app reads the PIN from them)
          if ($log -notmatch 'Initialized server socket') { throw "uxplay.exe's messages did not arrive while it was running" }
          if ($log -match 'gst_parse_launch|no element|could not set property') { throw "uxplay.exe reported a GStreamer error" }
          # the address the iPhone is told to connect to (lib/mdnsd picks the PC's main adapter)
          if ($log -notmatch 'mDNS: advertising on \d+\.\d+\.\d+\.\d+') { throw "uxplay.exe did not find a network address to advertise" }

      - name: Upload portable app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: UxPlay-Windows-portable
          path: windows/out/UxPlay
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup" }
          }
          $version = (Select-String -Path uxplay.cpp -Pattern '#define VERSION "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: UxPlay-Windows-installer
          path: windows/out/UxPlay-Setup.exe
          if-no-files-found: error

  # Publishes both downloads on the repository's Releases page, for a pushed
  # "v*" tag or a release_tag given when running the workflow by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: windows-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check release tag
        if: inputs.release_tag != ''
        run: |
          # v, then letters, digits, dots and dashes only (e.g. v1.74-win3-beta)
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.-]{0,40}$ ]] || { echo "release_tag must look like v1.74-win3, got: $RELEASE_TAG"; exit 1; }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist

      - name: Package portable zip
        run: cd dist/UxPlay-Windows-portable && zip -qr ../UxPlay-Windows-portable.zip .

      - name: Checksums
        # lets anyone check a download wasn't changed: certutil -hashfile UxPlay-Setup.exe SHA256
        run: |
          cp dist/UxPlay-Windows-installer/UxPlay-Setup.exe dist/
          cd dist && sha256sum UxPlay-Setup.exe UxPlay-Windows-portable.zip | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          # a release created by hand on GitHub keeps the notes typed there
          name: ${{ inputs.release_tag != '' && format('UxPlay for Windows ({0})', inputs.release_tag) || '' }}
          body_path: ${{ inputs.release_tag != '' && 'windows/RELEASE_NOTES.md' || '' }}
          # tags such as v1.74-win3-beta are published as a pre-release
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, '-rc') }}
          files: |
            dist/UxPlay-Setup.exe
            dist/UxPlay-Windows-portable.zip
            dist/SHA256SUMS.txt
